# 仅在本文件已进入默认分支后，GitHub 才会显示/接受 workflow_dispatch。
# 当前特性分支合并前的动态证据必须使用文档中的本地显式授权脚本。
name: Phase 41 MySQL 8.4 手工安全回环

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-init-real:
    name: 首次初始化与最小权限真实回环
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 语法检查
        run: bash -n scripts/test-phase41-mysql-init-real.sh
      - name: 在一次性 MySQL 8.4 容器执行认证与授权回环
        run: bash scripts/test-phase41-mysql-init-real.sh
