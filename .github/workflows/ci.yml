name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  phase41-runner-contract:
    name: Phase 41 runner 静态契约
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 冷缓存认证 fail-fast 契约
        run: |
          bash -n scripts/test-phase41-backup-restore-real.sh
          bash -n scripts/test-phase41-backup-restore-contract.sh
          bash scripts/test-phase41-backup-restore-contract.sh
      - name: WS-7 供应链静态合同
        run: |
          python3 scripts/test_ws7_supply_chain_contract.py
          bash scripts/test_ws7_image_identity_failure.sh
      - name: WS-8 V33 停机切换静态合同
        run: python3 -B scripts/test_ws8_v33_release_contract.py

  backend:
    name: 后端构建
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: teacher_cert
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Phase 41 MySQL 初始化脚本契约
        run: |
          bash scripts/test-phase41-mysql-init.sh
          bash -n scripts/test-phase41-mysql-init-real.sh
          bash -n scripts/test-phase41-backup-restore-real.sh
      - name: 启动并等待 MinIO
        run: |
          docker run --detach --name teacher-cert-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:5173,http://127.0.0.1:5173 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e server /data
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs teacher-cert-ci-minio
            exit 1
          fi
          docker run --rm --network container:teacher-cert-ci-minio \
            --env MC_HOST_ci=http://minioadmin:minioadmin123@127.0.0.1:9000 \
            minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952 \
            mb --ignore-existing ci/teacher-cert
      - name: 固定 Phase 0 隔离服务身份
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          REDIS_SERVICE_ID: ${{ job.services.redis.id }}
          PHASE00_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          PHASE00_RUN_CONTEXT: github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mysql_uuid="$(docker exec "$MYSQL_SERVICE_ID" \
            mysql -uroot -proot123 --batch --skip-column-names \
            -e 'SELECT @@GLOBAL.server_uuid')"
          redis_run_id="$(docker exec "$REDIS_SERVICE_ID" redis-cli --raw INFO server \
            | tr -d '\r' | sed -n 's/^run_id://p')"
          [[ "$mysql_uuid" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$redis_run_id" =~ ^[0-9a-fA-F]{40}$ ]]

          identity_nonce="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          identity_issued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          identity_object=".phase00-target/identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${identity_nonce:0:16}.json"
          identity_payload="$(
            IDENTITY_NONCE="$identity_nonce" IDENTITY_ISSUED_AT="$identity_issued_at" \
              python3 -c \
                'import json, os; print(json.dumps({"schemaVersion": 2, "candidateSha": os.environ["PHASE00_EXPECTED_CANDIDATE_SHA"], "runContext": os.environ["PHASE00_RUN_CONTEXT"], "identityNonce": os.environ["IDENTITY_NONCE"], "identityIssuedAt": os.environ["IDENTITY_ISSUED_AT"]}, separators=(",", ":")), end="")'
          )"
          identity_sha="$(printf '%s' "$identity_payload" | sha256sum | awk '{print $1}')"
          printf '%s' "$identity_payload" \
            | docker run --rm --interactive --network container:teacher-cert-ci-minio \
                --env MC_HOST_ci=http://minioadmin:minioadmin123@127.0.0.1:9000 \
                minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952 \
                pipe "ci/teacher-cert/$identity_object"

          {
            printf 'PHASE00_EXPECTED_CANDIDATE_SHA=%s\n' "$PHASE00_EXPECTED_CANDIDATE_SHA"
            printf 'PHASE00_RUN_CONTEXT=%s\n' "$PHASE00_RUN_CONTEXT"
            printf 'PHASE00_EXPECTED_MYSQL_SERVER_UUID=%s\n' "${mysql_uuid,,}"
            printf 'PHASE00_EXPECTED_REDIS_RUN_ID=%s\n' "${redis_run_id,,}"
            printf 'PHASE00_MINIO_IDENTITY_OBJECT=%s\n' "$identity_object"
            printf 'PHASE00_EXPECTED_MINIO_IDENTITY_SHA256=%s\n' "$identity_sha"
            printf 'PHASE00_EXPECTED_MINIO_IDENTITY_NONCE=%s\n' "$identity_nonce"
            printf 'PHASE00_EXPECTED_MINIO_IDENTITY_ISSUED_AT=%s\n' "$identity_issued_at"
          } >> "$GITHUB_ENV"
      - name: Phase 0 门禁脚本纯离线反例
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/test_phase00_ci_gate.py
      - name: Maven clean verify 与 Phase 0 精确证据门禁
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/teacher_cert?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_DATABASE: 0
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MINIO_BUCKET: teacher-cert
          PHASE00_TARGET_SCHEMA: teacher_cert
          PHASE00_MYSQL_SERVICE_MARKER: mysql://127.0.0.1:3306/teacher_cert
          PHASE00_REDIS_SERVICE_MARKER: redis://127.0.0.1:6379/0
          PHASE00_MINIO_SERVICE_MARKER: http://127.0.0.1:9000/teacher-cert
          PHASE00_RUN_CONTEXT: github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        # checkstyle 绑定在 validate 阶段（根 pom），verify 即自动执行后端 lint 门禁并在违规时红灯。
        run: >-
          python3 -B scripts/phase00_ci_gate.py run
          --evidence-dir "$RUNNER_TEMP/phase00-ci-evidence"
          --expected-candidate-sha "$GITHUB_SHA"
      - name: 上传 Phase 0 可验证证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase00-ci-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase00-ci-evidence
          if-no-files-found: error
          retention-days: 30
      - name: WS-8 加密、启动护栏与 V33 迁移精确门禁
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SPRING_PROFILES_ACTIVE: dev
          # Phase 0 exact gate 已在同一 job 完成；后续 WS-8 selector 不重复要求 fresh 空栈 attestation。
          PHASE00_EXPECTED_CANDIDATE_SHA: ''
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # 复用前一步 dev profile 写入现有测试数据时的固定测试密钥，避免用错误 key 读取已生成的 v1 密文。
          IDCARD_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          IDCARD_HMAC_PEPPER: dev-only-insecure-id-card-hmac-pepper-do-not-use-in-production
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/teacher_cert?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_DATABASE: 0
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MINIO_BUCKET: teacher-cert
        run: |
          set -euo pipefail
          rm -f \
            platform-security/target/surefire-reports/TEST-cn.edu.gpnu.platform.security.service.IdCardProtectionServiceTest.xml \
            platform-boot/target/surefire-reports/TEST-cn.edu.gpnu.platform.boot.config.RuntimeProfileGuardTest.xml \
            platform-boot/target/failsafe-reports/TEST-cn.edu.gpnu.platform.boot.V33IdCardProtectionMigrationIT.xml \
            platform-boot/target/failsafe-reports/TEST-cn.edu.gpnu.platform.boot.Phase3StudentIT.xml \
            platform-boot/target/failsafe-reports/TEST-cn.edu.gpnu.platform.boot.Phase10ExchangeIT.xml \
            platform-boot/target/failsafe-reports/TEST-cn.edu.gpnu.platform.boot.Phase41BackupIT.xml
          mvn -B -ntp -pl platform-boot -am \
            -Dtest=IdCardProtectionServiceTest,RuntimeProfileGuardTest \
            -Dit.test=V33IdCardProtectionMigrationIT,Phase3StudentIT,Phase10ExchangeIT,Phase41BackupIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            verify
          python3 -B scripts/verify_ws8_ci_reports.py
      - name: 上传 WS-8 精确门禁证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws8-ci-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/ws8-ci-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: 清理 MinIO
        if: always()
        run: docker rm --force teacher-cert-ci-minio || true

  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: lint、type-check、unit contracts 与 build
        working-directory: frontend
        run: |
          npm run lint
          npm run type-check
          npm run type-check:tests
          npm run test:unit
          npm run test:csp-contract
          npm run test:auth-logout-contract
          npm run test:dashboard-latest-request
          npm run test:ws4-video-auth-state-contract
          npm run build
          npm run bundle:check
          npm run test:bundle-budget
      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright 产品冒烟与 axe 基线
        working-directory: frontend
        run: npm run test:e2e
      - name: 上传 WS-6 浏览器失败证据
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws6-playwright-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/ws6-playwright
          if-no-files-found: ignore
          retention-days: 14

  container-images:
    name: 最终镜像与 SBOM
    needs: [phase41-runner-contract, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BACKEND_IMAGE: teacher-cert-platform/backend:sha-${{ github.sha }}
      FRONTEND_IMAGE: teacher-cert-platform/frontend:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 在全部质量门禁后构建最终镜像
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$BACKEND_IMAGE" \
            .
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$FRONTEND_IMAGE" \
            frontend
      - name: 验证默认运行身份并记录不可变镜像 ID
        run: |
          set -euo pipefail
          mkdir -p target/ws7-supply-chain

          backend_uid="$(docker run --rm --entrypoint id "$BACKEND_IMAGE" -u)"
          frontend_uid="$(docker run --rm --entrypoint id "$FRONTEND_IMAGE" -u)"
          [[ "$backend_uid" =~ ^[0-9]+$ && "$backend_uid" -ne 0 ]]
          [[ "$frontend_uid" =~ ^[0-9]+$ && "$frontend_uid" -ne 0 ]]

          backend_image_id="$(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE")"
          frontend_image_id="$(docker image inspect --format '{{.Id}}' "$FRONTEND_IMAGE")"
          [[ "$backend_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            printf 'source.revision=%s\n' "$GITHUB_SHA"
            printf 'backend.tag=%s\n' "$BACKEND_IMAGE"
            printf 'backend.uid=%s\n' "$backend_uid"
            printf 'backend.image.id=%s\n' "$backend_image_id"
            printf 'frontend.tag=%s\n' "$FRONTEND_IMAGE"
            printf 'frontend.uid=%s\n' "$frontend_uid"
            printf 'frontend.image.id=%s\n' "$frontend_image_id"
          } > target/ws7-supply-chain/image-identities.txt
      - name: 生成后端镜像 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.BACKEND_IMAGE }}
          format: spdx-json
          output-file: target/ws7-supply-chain/backend.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.51.0
      - name: 生成前端镜像 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.FRONTEND_IMAGE }}
          format: spdx-json
          output-file: target/ws7-supply-chain/frontend.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.51.0
      - name: 固定并自校验供应链产物哈希
        run: |
          set -euo pipefail
          test -s target/ws7-supply-chain/backend.spdx.json
          test -s target/ws7-supply-chain/frontend.spdx.json
          (
            cd target/ws7-supply-chain
            sha256sum backend.spdx.json frontend.spdx.json image-identities.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: 上传镜像身份、SBOM 与校验和
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws7-supply-chain-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/ws7-supply-chain
          if-no-files-found: error
          retention-days: 30
