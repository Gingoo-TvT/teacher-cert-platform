name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  phase41-runner-contract:
    name: Phase 41 runner 静态契约
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 冷缓存认证 fail-fast 契约
        run: |
          bash -n scripts/test-phase41-backup-restore-real.sh
          bash -n scripts/test-phase41-backup-restore-contract.sh
          bash scripts/test-phase41-backup-restore-contract.sh

  backend:
    name: 后端构建
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: teacher_cert
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Phase 41 MySQL 初始化脚本契约
        run: |
          bash scripts/test-phase41-mysql-init.sh
          bash -n scripts/test-phase41-mysql-init-real.sh
          bash -n scripts/test-phase41-backup-restore-real.sh
      - name: 启动并等待 MinIO
        run: |
          docker run --detach --name teacher-cert-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:5173,http://127.0.0.1:5173 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs teacher-cert-ci-minio
            exit 1
          fi
          docker run --rm --network container:teacher-cert-ci-minio \
            --env MC_HOST_ci=http://minioadmin:minioadmin123@127.0.0.1:9000 \
            minio/mc:RELEASE.2025-04-08T15-39-49Z \
            mb --ignore-existing ci/teacher-cert
      - name: Phase 0 门禁脚本纯离线反例
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/test_phase00_ci_gate.py
      - name: Maven clean verify 与 Phase 0 精确证据门禁
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/teacher_cert?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_DATABASE: 0
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MINIO_BUCKET: teacher-cert
          PHASE00_TARGET_SCHEMA: teacher_cert
          PHASE00_MYSQL_SERVICE_MARKER: mysql:8.4@127.0.0.1:3306
          PHASE00_REDIS_SERVICE_MARKER: redis:7@127.0.0.1:6379/0
          PHASE00_MINIO_SERVICE_MARKER: minio:RELEASE.2025-04-22T22-12-26Z@127.0.0.1:9000/teacher-cert
          PHASE00_RUN_CONTEXT: github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        # checkstyle 绑定在 validate 阶段（根 pom），verify 即自动执行后端 lint 门禁并在违规时红灯。
        run: >-
          python3 -B scripts/phase00_ci_gate.py run
          --evidence-dir "$RUNNER_TEMP/phase00-ci-evidence"
          --expected-candidate-sha "$GITHUB_SHA"
      - name: 上传 Phase 0 可验证证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase00-ci-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase00-ci-evidence
          if-no-files-found: error
          retention-days: 30
      - name: 清理 MinIO
        if: always()
        run: docker rm --force teacher-cert-ci-minio || true

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci、lint、type-check 与 build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run build
