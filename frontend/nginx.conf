# 生产 nginx（Phase 37a-part2：P0-9 TLS 就绪 + P1-3 代理超时 + P1-4 安全响应头）。
# 注：此文件用于 Docker 生产部署（容器内 nginx 托管构建产物 + 反代后端）；开发 vite 不受影响。
#
# ===== 上线启用 HTTPS（由运维提供证书后取消注释本块，并把下方 :80 改为 301 跳转）=====
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name your.domain.edu.cn;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;   # 运维提供
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;     # 运维提供
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     # ……以下 root/index/安全头/location 与 :80 块一致，X-Forwarded-Proto 为 https……
# }
# # 启用 HTTPS 后，把 :80 改成整站跳转：
# server { listen 80; server_name your.domain.edu.cn; return 301 https://$host$request_uri; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    # 安全响应头（P1-4）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大批量导入/大文件上传：放宽代理超时，避免默认 60s 触发 502/504（P1-3）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 带内容哈希的静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
