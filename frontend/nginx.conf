# 生产 nginx（WS-5/T1：TLS/HSTS + Phase 37a 代理超时与安全响应头）。
# 注：此文件用于 Docker 生产部署；开发 vite 不受影响。
server {
    listen 8080;
    server_name ${TLS_SERVER_NAME};

    # 容器内部健康检查保留明文端点；所有业务请求统一跳转 HTTPS。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://${TLS_SERVER_NAME}:${FRONTEND_HTTPS_PORT}$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name ${TLS_SERVER_NAME};

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 仅信任运维显式配置的外层入口代理；默认 127.0.0.1/32 等同于不信任远端转发头。
    # 命中后 real_ip 模块从右向左收窄来源，下面再覆盖发往 backend 的头。
    set_real_ip_from ${INGRESS_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    # 安全响应头（P1-4）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # WS-5/T2：材料/PDF 预览保留同源 object/frame；MinIO 仅用于预签名直传连接。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ${MINIO_PUBLIC_ENDPOINT}; worker-src 'self'; manifest-src 'self'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # 保留浏览器看到的端口；否则非 80/443 入口会被后端误判为跨域。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 边界代理覆盖客户端自带 XFF；后端只信任本容器固定的审计网络地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大批量导入/大文件上传：放宽代理超时，避免默认 60s 触发 502/504（P1-3）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 带内容哈希的静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
