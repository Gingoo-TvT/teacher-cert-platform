# WS8_V33_OFFLINE_UPGRADE：已有数据库最高版本为 V32 时，禁止直接执行通用 up 或滚动混部；
# 必须先按 docs/phase-14-非功能部署验收.md 的 WS-8/V33 停机切换合同冻结写入、停尽旧节点并留好恢复点。
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    container_name: teacher-cert-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Phase 41 整改：不把可配置库名交给官方 entrypoint 未经本项目校验地提前消费；
      # 由 01-app-user.sh 校验 APP_DATABASE 后创建库与最小权限账号。
      APP_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-teacher_app}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      # Phase 41 恢复产物声明 32 MiB 单语句上限，并要求目标服务端至少支持 64 MiB packet。
      - --max-allowed-packet=64M
    # 不再 publish 3306 到主机（Phase 41.1，P0-5）：backend 走内部 DNS(mysql:3306) 即可，
    # 主机网无需（也不应）能直连数据库；如需运维排障，用 `docker exec -it teacher-cert-mysql-prod mysql ...`。
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: teacher-cert-redis-prod
    restart: unless-stopped
    # Phase 41.3：加密码认证（--requirepass），配套 application-prod.yml 的 spring.data.redis.password
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # 不再 publish 6379 到主机（Phase 41.3）：backend 走内部 DNS(redis:6379)，主机网无需直连。
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: teacher-cert-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MinIO 的 S3 PutBucketCors API 返回 501；浏览器直传来源必须在服务启动时配置。
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS}
    # 浏览器只访问 MINIO_PUBLIC_ENDPOINT 对应的 HTTPS 网关；API/console 不直接暴露到主机公网。
    # 回环绑定为同机 TLS 网关和受控运维保留入口，远端管理请经现有运维通道转发。
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: teacher-cert-platform/backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be an immutable source revision tag}
    container_name: teacher-cert-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      # Phase 41.1（P0-5）：非 root 最小权限账号，由 deploy/mysql-init/01-app-user.sh 创建；
      # 对应 application-prod.yml 的 spring.datasource.username/password: ${DB_USERNAME}/${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME:-teacher_app}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Phase 41.3：对应 application-prod.yml 的 spring.data.redis.password: ${REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Phase 44：字典缓存写窗口的逐 owner 租约。所有后端实例必须使用同一组值；
      # 默认 2m/20s，续租周期必须为正且不超过租约的三分之一，非法组合会在启动期失败关闭。
      DICT_CACHE_WRITER_LEASE: ${DICT_CACHE_WRITER_LEASE:-2m}
      DICT_CACHE_WRITER_RENEW_INTERVAL: ${DICT_CACHE_WRITER_RENEW_INTERVAL:-20s}
      MINIO_ENDPOINT: http://minio:9000
      # 浏览器直传/播放使用的外部地址；不得填 http://minio:9000 这类容器内 DNS。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-teacher-cert}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PRESIGN_EXPIRY_SECONDS: ${MINIO_PRESIGN_EXPIRY_SECONDS:-900}
      MINIO_DIRECT_UPLOAD_ENABLED: ${MINIO_DIRECT_UPLOAD_ENABLED:-true}
      MINIO_DIRECT_UPLOAD_INIT_TIMEOUT_SECONDS: ${MINIO_DIRECT_UPLOAD_INIT_TIMEOUT_SECONDS:-120}
      MINIO_DIRECT_UPLOAD_COMPLETE_TIMEOUT_SECONDS: ${MINIO_DIRECT_UPLOAD_COMPLETE_TIMEOUT_SECONDS:-300}
      MINIO_CONNECTION_TIMEOUT_SECONDS: ${MINIO_CONNECTION_TIMEOUT_SECONDS:-10}
      MINIO_READ_TIMEOUT_SECONDS: ${MINIO_READ_TIMEOUT_SECONDS:-30}
      MINIO_CALL_TIMEOUT_SECONDS: ${MINIO_CALL_TIMEOUT_SECONDS:-900}
      BACKUP_MAX_SQL_STATEMENT_BYTES: ${BACKUP_MAX_SQL_STATEMENT_BYTES:-33554432}
      # WS-03：媒体探测使用单实例独占持久卷和总量预留，避免占用容器 overlay。
      # 禁止通过 --scale 让多个 backend 共享下方命名卷；扩容须改为 per-replica 独立卷/配额。
      VIDEO_PROBE_TEMP_DIR: /var/lib/teacher-cert/video-probe
      VIDEO_PROBE_MAX_CONCURRENT: ${VIDEO_PROBE_MAX_CONCURRENT:-2}
      VIDEO_PROBE_MAX_RESERVED_BYTES: ${VIDEO_PROBE_MAX_RESERVED_BYTES:-4294967296}
      VIDEO_PROBE_MIN_FREE_BYTES: ${VIDEO_PROBE_MIN_FREE_BYTES:-1073741824}
      VIDEO_PROBE_MAX_DURATION: ${VIDEO_PROBE_MAX_DURATION:-PT10M}
      VIDEO_PROBE_MAX_PACKETS: ${VIDEO_PROBE_MAX_PACKETS:-2000000}
      VIDEO_PROBE_LEASE_DURATION: ${VIDEO_PROBE_LEASE_DURATION:-PT2M}
      VIDEO_PROBE_LEASE_RENEW_INTERVAL: ${VIDEO_PROBE_LEASE_RENEW_INTERVAL:-PT30S}
      VIDEO_PROBE_WORKER_MAX_HEAP_MB: ${VIDEO_PROBE_WORKER_MAX_HEAP_MB:-256}
      VIDEO_PROBE_PARENT_CHECK_INTERVAL: ${VIDEO_PROBE_PARENT_CHECK_INTERVAL:-PT1S}
      VIDEO_PROBE_ARTIFACT_HEARTBEAT_INTERVAL: ${VIDEO_PROBE_ARTIFACT_HEARTBEAT_INTERVAL:-PT30S}
      VIDEO_PROBE_ARTIFACT_OWNER_STALE_AFTER: ${VIDEO_PROBE_ARTIFACT_OWNER_STALE_AFTER:-PT2M}
      VIDEO_PROBE_ARTIFACT_ORPHAN_TTL: ${VIDEO_PROBE_ARTIFACT_ORPHAN_TTL:-PT30M}
      VIDEO_PROBE_ARTIFACT_LEGACY_ORPHAN_TTL: ${VIDEO_PROBE_ARTIFACT_LEGACY_ORPHAN_TTL:-PT24H}
      VIDEO_PROBE_ARTIFACT_CLEANUP_INTERVAL: ${VIDEO_PROBE_ARTIFACT_CLEANUP_INTERVAL:-PT5M}
      VIDEO_PROBE_ARTIFACT_CLEANUP_SCAN_LIMIT: ${VIDEO_PROBE_ARTIFACT_CLEANUP_SCAN_LIMIT:-10000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      # WS-11：Prometheus 独立机器身份，不经过业务 JWT、Redis 会话或 sys_user。
      PROMETHEUS_SCRAPE_USERNAME: ${PROMETHEUS_SCRAPE_USERNAME}
      PROMETHEUS_SCRAPE_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-3s}
      READINESS_MINIO_CONNECT_TIMEOUT: ${READINESS_MINIO_CONNECT_TIMEOUT:-1s}
      READINESS_MINIO_READ_TIMEOUT: ${READINESS_MINIO_READ_TIMEOUT:-2s}
      READINESS_MINIO_CALL_TIMEOUT: ${READINESS_MINIO_CALL_TIMEOUT:-2s}
      # WS-8：AES-256 密钥与 HMAC pepper 必须独立，缺失/示例值会在生产启动期失败关闭。
      IDCARD_ENCRYPTION_KEY: ${IDCARD_ENCRYPTION_KEY}
      IDCARD_HMAC_PEPPER: ${IDCARD_HMAC_PEPPER}
      # WS-2：显式转发生产凭据；Compose 的 .env 只负责插值，不会自动把变量注入容器。
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:-}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:-}
      # P1-7：CORS 前端来源白名单（逗号分隔，含协议+端口、无末尾斜杠）。留空时后端回退到仅本地
      # localhost:5173（CorsConfig 默认），生产跨域前端会被拦截；同源部署（nginx 同域反代）下 CORS 不参与。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 只信任会覆盖 XFF/X-Real-IP 的后端直连代理；未显式配置时忽略所有转发头。
      AUDIT_TRUSTED_PROXIES: ${FRONTEND_AUDIT_PROXY_IP:-172.30.42.10}
      # 标准名册导入进程级资源预算，解析和错误明细物化前即拒绝超限输入。
      EXCHANGE_IMPORT_MAX_FILE_BYTES: ${EXCHANGE_IMPORT_MAX_FILE_BYTES:-16777216}
      EXCHANGE_IMPORT_MAX_EXPANDED_BYTES: ${EXCHANGE_IMPORT_MAX_EXPANDED_BYTES:-67108864}
      EXCHANGE_IMPORT_MAX_ROWS: ${EXCHANGE_IMPORT_MAX_ROWS:-20000}
      EXCHANGE_IMPORT_MAX_CELL_CHARACTERS: ${EXCHANGE_IMPORT_MAX_CELL_CHARACTERS:-4096}
      EXCHANGE_IMPORT_MAX_ERROR_DETAILS: ${EXCHANGE_IMPORT_MAX_ERROR_DETAILS:-20000}
      EXCHANGE_IMPORT_MAX_PREVIEW_JSON_BYTES: ${EXCHANGE_IMPORT_MAX_PREVIEW_JSON_BYTES:-20971520}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      PLATFORM_INTEGRATION_IDENTITY_ENABLED: ${PLATFORM_INTEGRATION_IDENTITY_ENABLED:-false}
      PLATFORM_INTEGRATION_ACADEMIC_ENABLED: ${PLATFORM_INTEGRATION_ACADEMIC_ENABLED:-false}
      PLATFORM_INTEGRATION_STUDENT_REGISTRY_ENABLED: ${PLATFORM_INTEGRATION_STUDENT_REGISTRY_ENABLED:-false}
      PLATFORM_INTEGRATION_ELECTRONIC_SIGNATURE_ENABLED: ${PLATFORM_INTEGRATION_ELECTRONIC_SIGNATURE_ENABLED:-false}
      PLATFORM_INTEGRATION_ELECTRONIC_LICENSE_ENABLED: ${PLATFORM_INTEGRATION_ELECTRONIC_LICENSE_ENABLED:-false}
      PLATFORM_INTEGRATION_SUPERIOR_PLATFORM_ENABLED: ${PLATFORM_INTEGRATION_SUPERIOR_PLATFORM_ENABLED:-false}
    volumes:
      - video-probe-temp:/var/lib/teacher-cert/video-probe
    networks:
      default:
      audit-proxy:
        ipv4_address: ${BACKEND_AUDIT_PROXY_IP:-172.30.42.20}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: teacher-cert-platform/frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be an immutable source revision tag}
    container_name: teacher-cert-frontend-prod
    restart: unless-stopped
    environment:
      # 外层网关存在时必须填其精确 IP/CIDR；直连部署保持默认即可。
      INGRESS_TRUSTED_PROXY_CIDR: ${INGRESS_TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?TLS_SERVER_NAME must be set}
      # 同一值既控制宿主 HTTPS 发布端口，也进入 HTTP 301 的目标 authority。
      FRONTEND_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-443}
      # CSP 的 MinIO 连接源与后端签发预签名 URL 的公网端点保持同一真源。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT must be set}
    ports:
      - "${FRONTEND_PORT:-80}:8080"
      - "${FRONTEND_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${TLS_CERTIFICATE_DIR:?TLS_CERTIFICATE_DIR must be set}
        target: /etc/nginx/certs
        read_only: true
    # 只授予 nginx 读取证书实体文件的补充组；私钥不得改为全局可读。
    group_add:
      - "${TLS_CERTIFICATE_GID:?TLS_CERTIFICATE_GID must be set to the dedicated certificate group GID}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      audit-proxy:
        ipv4_address: ${FRONTEND_AUDIT_PROXY_IP:-172.30.42.10}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  minio-data:
  video-probe-temp:

networks:
  audit-proxy:
    ipam:
      config:
        - subnet: ${AUDIT_PROXY_SUBNET:-172.30.42.0/24}
