services:
  mysql:
    image: mysql:8.4
    container_name: teacher-cert-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Phase 41.1（P0-5）：供 deploy/mysql-init/01-app-user.sh 首次初始化时建最小权限应用账号
      DB_USERNAME: ${DB_USERNAME:-teacher_app}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    # 不再 publish 3306 到主机（Phase 41.1，P0-5）：backend 走内部 DNS(mysql:3306) 即可，
    # 主机网无需（也不应）能直连数据库；如需运维排障，用 `docker exec -it teacher-cert-mysql-prod mysql ...`。
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: teacher-cert-redis-prod
    restart: unless-stopped
    # Phase 41.3：加密码认证（--requirepass），配套 application-prod.yml 的 spring.data.redis.password
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # 不再 publish 6379 到主机（Phase 41.3）：backend 走内部 DNS(redis:6379)，主机网无需直连。
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: teacher-cert-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: teacher-cert-platform/backend:${APP_IMAGE_TAG:-latest}
    container_name: teacher-cert-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      # Phase 41.1（P0-5）：非 root 最小权限账号，由 deploy/mysql-init/01-app-user.sh 创建；
      # 对应 application-prod.yml 的 spring.datasource.username/password: ${DB_USERNAME}/${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME:-teacher_app}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Phase 41.3：对应 application-prod.yml 的 spring.data.redis.password: ${REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-teacher-cert}
      JWT_SECRET: ${JWT_SECRET}
      # WS-2：显式转发生产凭据；Compose 的 .env 只负责插值，不会自动把变量注入容器。
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:-}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:-}
      # P1-7：CORS 前端来源白名单（逗号分隔，含协议+端口、无末尾斜杠）。留空时后端回退到仅本地
      # localhost:5173（CorsConfig 默认），生产跨域前端会被拦截；同源部署（nginx 同域反代）下 CORS 不参与。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      PLATFORM_INTEGRATION_IDENTITY_ENABLED: ${PLATFORM_INTEGRATION_IDENTITY_ENABLED:-false}
      PLATFORM_INTEGRATION_ACADEMIC_ENABLED: ${PLATFORM_INTEGRATION_ACADEMIC_ENABLED:-false}
      PLATFORM_INTEGRATION_STUDENT_REGISTRY_ENABLED: ${PLATFORM_INTEGRATION_STUDENT_REGISTRY_ENABLED:-false}
      PLATFORM_INTEGRATION_ELECTRONIC_SIGNATURE_ENABLED: ${PLATFORM_INTEGRATION_ELECTRONIC_SIGNATURE_ENABLED:-false}
      PLATFORM_INTEGRATION_ELECTRONIC_LICENSE_ENABLED: ${PLATFORM_INTEGRATION_ELECTRONIC_LICENSE_ENABLED:-false}
      PLATFORM_INTEGRATION_SUPERIOR_PLATFORM_ENABLED: ${PLATFORM_INTEGRATION_SUPERIOR_PLATFORM_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: teacher-cert-platform/frontend:${APP_IMAGE_TAG:-latest}
    container_name: teacher-cert-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  minio-data:
