name: teacher-cert-prod

services:
  mysql:
    image: mysql:8.4
    container_name: teacher-cert-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      APP_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-allowed-packet=64M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: teacher-cert-redis-prod
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: teacher-cert-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:?MINIO_CORS_ALLOWED_ORIGINS is required}
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT is required}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/teacher-cert-backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: teacher-cert-backend-prod
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DICT_CACHE_WRITER_LEASE: 2m
      DICT_CACHE_WRITER_RENEW_INTERVAL: 20s
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: teacher-cert
      MINIO_REGION: us-east-1
      MINIO_PRESIGN_EXPIRY_SECONDS: "900"
      MINIO_DIRECT_UPLOAD_ENABLED: "true"
      MINIO_DIRECT_UPLOAD_INIT_TIMEOUT_SECONDS: "120"
      MINIO_DIRECT_UPLOAD_COMPLETE_TIMEOUT_SECONDS: "300"
      MINIO_CONNECTION_TIMEOUT_SECONDS: "10"
      MINIO_READ_TIMEOUT_SECONDS: "30"
      MINIO_CALL_TIMEOUT_SECONDS: "900"
      BACKUP_MAX_SQL_STATEMENT_BYTES: "33554432"
      VIDEO_PROBE_TEMP_DIR: /var/lib/teacher-cert/video-probe
      VIDEO_PROBE_MAX_CONCURRENT: "2"
      VIDEO_PROBE_MAX_RESERVED_BYTES: "4294967296"
      VIDEO_PROBE_MIN_FREE_BYTES: "1073741824"
      VIDEO_PROBE_MAX_DURATION: PT10M
      VIDEO_PROBE_MAX_PACKETS: "2000000"
      VIDEO_PROBE_LEASE_DURATION: PT2M
      VIDEO_PROBE_LEASE_RENEW_INTERVAL: PT30S
      VIDEO_PROBE_WORKER_MAX_HEAP_MB: "256"
      VIDEO_PROBE_PARENT_CHECK_INTERVAL: PT1S
      VIDEO_PROBE_ARTIFACT_HEARTBEAT_INTERVAL: PT30S
      VIDEO_PROBE_ARTIFACT_OWNER_STALE_AFTER: PT2M
      VIDEO_PROBE_ARTIFACT_ORPHAN_TTL: PT30M
      VIDEO_PROBE_ARTIFACT_LEGACY_ORPHAN_TTL: PT24H
      VIDEO_PROBE_ARTIFACT_CLEANUP_INTERVAL: PT5M
      VIDEO_PROBE_ARTIFACT_CLEANUP_SCAN_LIMIT: "10000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:?ADMIN_INITIAL_PASSWORD_HASH is required}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:?STAFF_INITIAL_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      PLATFORM_INTEGRATION_IDENTITY_ENABLED: "false"
      PLATFORM_INTEGRATION_ACADEMIC_ENABLED: "false"
      PLATFORM_INTEGRATION_STUDENT_REGISTRY_ENABLED: "false"
      PLATFORM_INTEGRATION_ELECTRONIC_SIGNATURE_ENABLED: "false"
      PLATFORM_INTEGRATION_ELECTRONIC_LICENSE_ENABLED: "false"
      PLATFORM_INTEGRATION_SUPERIOR_PLATFORM_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:8080"
    volumes:
      - video-probe-temp:/var/lib/teacher-cert/video-probe
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /api/health HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/teacher-cert-frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: teacher-cert-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
    name: teacher-cert-mysql-data
  redis-data:
    name: teacher-cert-redis-data
  minio-data:
    name: teacher-cert-minio-data
  video-probe-temp:
    name: teacher-cert-video-probe-temp
