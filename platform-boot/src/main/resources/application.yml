server:
  port: 8080

spring:
  application:
    name: teacher-cert-platform
  profiles:
    active: dev

# 接口文档：访问 http://localhost:8080/doc.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.edu.gpnu.platform: info
