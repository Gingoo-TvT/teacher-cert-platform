server:
  port: 8080

spring:
  application:
    name: teacher-cert-platform
  profiles:
    active: dev

# 接口文档：访问 http://localhost:8080/doc.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.edu.gpnu.platform: info

platform:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    login:
      lock-threshold: ${LOGIN_LOCK_THRESHOLD:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      captcha-ttl-seconds: ${CAPTCHA_TTL_SECONDS:120}
