server:
  port: 8080

spring:
  application:
    name: teacher-cert-platform
  servlet:
    multipart:
      # 与 file.maxSize.* 业务参数对齐：材料/佐证 50MB 级、名册 Excel 数十 MB；
      # 不设则 Spring 默认 1MB/10MB，业务上限形同虚设（上传直接被框架拒绝）。
      max-file-size: 100MB
      max-request-size: 120MB

# 接口文档：访问 http://localhost:8080/doc.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Phase 0 退回整改（U-004）发现的真实回归：knife4j 4.5.0 的增强层（Knife4jOpenApiCustomizer）按
# springdoc 2.3.0 的 `List getGroupConfigs()` 二进制链接，而 SB 3.4 所需的 springdoc ≥2.4 已改为返回 Set，
# 请求 /v3/api-docs 即 NoSuchMethodError（Phase 40 升级后从未有测试真正请求过文档端点，Phase00ScaffoldIT 首次捕获）。
# knife4j 无更新版本（4.5.0 为最新），故关闭其增强自动装配：doc.html UI 是 knife4j-openapi3-ui webjar 的静态资源，
# 不受此开关影响，仍由标准 springdoc 端点供数；损失仅为未使用的增强扩展（@ApiSupport 排序、x-setting 界面定制）。
knife4j:
  enable: false

logging:
  level:
    cn.edu.gpnu.platform: info

platform:
  cache:
    dictionary:
      # 活事务会后台续租，并在提交前强制验证；租约只承担崩溃后的 owner 回收。
      writer-lease: ${DICT_CACHE_WRITER_LEASE:2m}
      writer-renew-interval: ${DICT_CACHE_WRITER_RENEW_INTERVAL:20s}
  video:
    probe:
      # 媒体真实性校验在主进程中的临时资源硬上限；生产可用同名环境变量覆盖。
      temp-directory: ${VIDEO_PROBE_TEMP_DIR:${java.io.tmpdir}/teacher-cert-video-probe}
      max-concurrent: ${VIDEO_PROBE_MAX_CONCURRENT:2}
      max-reserved-bytes: ${VIDEO_PROBE_MAX_RESERVED_BYTES:4294967296}
      min-free-bytes: ${VIDEO_PROBE_MIN_FREE_BYTES:1073741824}
      max-duration: ${VIDEO_PROBE_MAX_DURATION:10m}
      max-packets: ${VIDEO_PROBE_MAX_PACKETS:2000000}
      lease-duration: ${VIDEO_PROBE_LEASE_DURATION:2m}
      lease-renew-interval: ${VIDEO_PROBE_LEASE_RENEW_INTERVAL:30s}
      worker-max-heap-mb: ${VIDEO_PROBE_WORKER_MAX_HEAP_MB:256}
      parent-check-interval: ${VIDEO_PROBE_PARENT_CHECK_INTERVAL:1s}
      artifact-heartbeat-interval: ${VIDEO_PROBE_ARTIFACT_HEARTBEAT_INTERVAL:30s}
      artifact-owner-stale-after: ${VIDEO_PROBE_ARTIFACT_OWNER_STALE_AFTER:2m}
      artifact-orphan-ttl: ${VIDEO_PROBE_ARTIFACT_ORPHAN_TTL:30m}
      artifact-legacy-orphan-ttl: ${VIDEO_PROBE_ARTIFACT_LEGACY_ORPHAN_TTL:24h}
      artifact-cleanup-interval: ${VIDEO_PROBE_ARTIFACT_CLEANUP_INTERVAL:5m}
      artifact-cleanup-scan-limit: ${VIDEO_PROBE_ARTIFACT_CLEANUP_SCAN_LIMIT:10000}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    login:
      lock-threshold: ${LOGIN_LOCK_THRESHOLD:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      captcha-ttl-seconds: ${CAPTCHA_TTL_SECONDS:120}
    # STAFF 创建/重置初始口令（WS-2 审计#4）：base 空默认 → 生产必须显式注入 STAFF_INITIAL_PASSWORD，
    # 否则 SecurityAdminServiceImpl 启动即 fail-fast（同 JWT_SECRET 风格）；dev 走 application-dev.yml 默认值。
    initial-password: ${STAFF_INITIAL_PASSWORD:}
    admin:
      # 生产 admin bootstrap（WS-2 审计#1）：生产必须注入合法且不对应公开口令的 BCrypt 哈希；仅当 admin
      # 仍使用 V8 公开种子口令时替换一次，首登改密/停用后重启不覆写。dev 不设时保留测试种子 admin。
      initial-password-hash: ${ADMIN_INITIAL_PASSWORD_HASH:}
