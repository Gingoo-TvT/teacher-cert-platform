spring:
  datasource:
    url: jdbc:mysql://localhost:3306/teacher_cert?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    # Phase 52（种子测试/生产分离）：dev/test 额外加载 db/testseed（R__testseed 重放测试专用种子），
    # 生产 profile 只加载 db/migration（application-prod.yml），故 V26 删除后生产保持干净。
    # IT 由 src/test/resources/config/application.yml 显式激活 dev，因此会加载 db/testseed，测试数据照常可用。
    locations: classpath:db/migration,classpath:db/testseed
    baseline-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO（platform-file 使用，Chunk B）
minio:
  endpoint: http://localhost:9000
  # 预签名 URL 的 host 必须从浏览器可达；应用内部 endpoint 与它不得混用。
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: teacher-cert
  region: us-east-1
  presign-expiry-seconds: 900
  direct-upload-enabled: ${MINIO_DIRECT_UPLOAD_ENABLED:true}
  direct-upload-init-timeout-seconds: ${MINIO_DIRECT_UPLOAD_INIT_TIMEOUT_SECONDS:120}
  direct-upload-complete-timeout-seconds: ${MINIO_DIRECT_UPLOAD_COMPLETE_TIMEOUT_SECONDS:300}
  connection-timeout-seconds: ${MINIO_CONNECTION_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${MINIO_READ_TIMEOUT_SECONDS:30}
  call-timeout-seconds: ${MINIO_CALL_TIMEOUT_SECONDS:900}

# 安全（platform-security）—— 仅 dev 的 JWT 密钥默认值；显式选择 dev 后，本地启动无需另配 JWT_SECRET。
# base application.yml 为 `secret: ${JWT_SECRET:}`（空默认、全 profile）；未注入 JWT_SECRET 时 JwtService.init
# 会抛错拒绝启动（这是生产的正确行为：密钥必须显式注入、不硬编码进包）。dev profile 在此提供一个明确标注
# 「仅供本地、切勿用于生产」的默认值：若设置了环境变量 JWT_SECRET 则优先用它，否则用该默认值。
# 生产走 application-prod.yml（active=prod，不加载本文件）+ base 空默认 → 仍强制注入 JWT_SECRET，安全不削弱。
platform:
  observability:
    prometheus:
      username: ${PROMETHEUS_SCRAPE_USERNAME:dev-prometheus}
      password: ${PROMETHEUS_SCRAPE_PASSWORD:dev-only-prometheus-password}
  security:
    # 仅供 dev/test 的固定非生产 secret；生产 profile 不加载本文件。
    id-card:
      encryption-key: ${IDCARD_ENCRYPTION_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      hmac-pepper: ${IDCARD_HMAC_PEPPER:dev-only-insecure-id-card-hmac-pepper-do-not-use-in-production}
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-production-0123456789}
    # dev/test STAFF 初始口令默认值（对应 base 的空默认）：本地/IT「开箱即用」；生产不加载本文件 →
    # base 空默认强制注入 STAFF_INITIAL_PASSWORD。dev 不设 admin.initial-password-hash → 保留测试种子 admin。
    initial-password: ${STAFF_INITIAL_PASSWORD:ChangeMe123!}
