# 生产 profile（Phase 37a 安全急修 P0-4）：关闭接口文档 + 显式 Flyway 安全项。
# 其余配置继承 application.yml；主配置不再提供默认 profile，启动必须显式设置
# SPRING_PROFILES_ACTIVE=prod（docker-compose.yml 已设）。

# 关闭 Swagger / Knife4j —— 生产不暴露 API 文档与"试调"界面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true

spring:
  # 生产 DB 账号非 root（Phase 41.1，P0-5）：由 deploy/mysql-init/01-app-user.sh 创建的最小权限
  # 账号，用户名/密码经环境变量注入（docker-compose.yml 的 backend 服务 environment），不落明文；
  # url 仍沿用 SPRING_DATASOURCE_URL 环境变量（host/库名不变，仅收窄连接账号权限）。
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Redis 生产加密码（Phase 41.3）：与 prod compose redis --requirepass 配套，env 注入。
  data:
    redis:
      password: ${REDIS_PASSWORD}
  # Flyway 生产安全：禁用 clean、允许在已有非空库上 baseline，避免首次部署硬失败
  # Phase 52（种子测试/生产分离）：显式只加载 db/migration（不含 db/testseed），
  # 配合 V26 删除，生产不再引入测试专用种子（测试学院 201/202、test_* 账号、免考占位等）。
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

logging:
  level:
    cn.edu.gpnu.platform: info

# MinIO 内外端点分离：endpoint 仅供容器内应用访问；public-endpoint 写入预签名 URL，必须由浏览器可达。
# WS-5 启用 HTTPS 后，MINIO_PUBLIC_ENDPOINT 必须同步使用 https，避免浏览器 mixed-content 拦截。
minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  region: ${MINIO_REGION:us-east-1}
  presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:900}
  direct-upload-enabled: ${MINIO_DIRECT_UPLOAD_ENABLED:true}
  direct-upload-init-timeout-seconds: ${MINIO_DIRECT_UPLOAD_INIT_TIMEOUT_SECONDS:120}
  direct-upload-complete-timeout-seconds: ${MINIO_DIRECT_UPLOAD_COMPLETE_TIMEOUT_SECONDS:300}
  connection-timeout-seconds: ${MINIO_CONNECTION_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${MINIO_READ_TIMEOUT_SECONDS:30}
  call-timeout-seconds: ${MINIO_CALL_TIMEOUT_SECONDS:900}

# Phase 41.2（P0-6 真备份）：仅生产开启应用内定时全量备份（dev/测试默认关闭、不触发）。
# 产物 = JDBC 逻辑导出→gzip→MinIO（默认复用业务桶 + db-backup/ 前缀；如需独立桶设 platform.backup.bucket）。
platform:
  video:
    finalization-reconciliation:
      # 正确性关键作业：不受 platform.cleanup.schedule.enabled 影响，prod profile 始终注册。
      cron: "0 * * * * *"
  backup:
    schedule:
      enabled: true
      cron: "0 0 3 * * *"   # 每日 03:00 低峰全量备份
    # bucket: teacher-cert-backup   # 可选：独立备份桶（不设则复用 minio.bucket）
    prefix: db-backup/
    # TCP_SQL_V2 单条恢复 SQL 上限；只允许向下收紧，恢复两端必须支持至少 64 MiB packet。
    max-sql-statement-bytes: ${BACKUP_MAX_SQL_STATEMENT_BYTES:33554432}
  # Phase 47（P1-9 定时清理）：仅生产开启（dev/测试默认关闭、不触发）。错峰于备份(03:00)之后。
  # 保留期/阈值可经 sys_param 覆盖（cleanup.auditLog.retentionDays 默认180 / cleanup.notification.retentionDays 默认90
  # / cleanup.prune.batchSize 默认1000 / cleanup.minio.abortIncompleteDays 默认7 / cleanup.orphan.graceHours 默认24）。
  cleanup:
    schedule:
      enabled: true
      retention-cron: "0 30 3 * * *"   # audit_log/notification 保留期物理清理
      minio-cron: "0 45 3 * * *"       # 确保 MinIO 未完成分片 abort 生命周期规则
      orphan-cron: "0 0 4 * * *"       # 孤儿 file_object 扫描（仅报告、不删除）
