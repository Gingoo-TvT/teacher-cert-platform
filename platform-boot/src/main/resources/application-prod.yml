# 生产 profile（Phase 37a 安全急修 P0-4）：关闭接口文档 + 显式 Flyway 安全项。
# 其余配置继承 application.yml；启动用 SPRING_PROFILES_ACTIVE=prod（docker-compose.yml 已设）。

# 关闭 Swagger / Knife4j —— 生产不暴露 API 文档与"试调"界面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true

spring:
  # 生产 DB 账号非 root（Phase 41.1，P0-5）：由 deploy/mysql-init/01-app-user.sh 创建的最小权限
  # 账号，用户名/密码经环境变量注入（docker-compose.yml 的 backend 服务 environment），不落明文；
  # url 仍沿用 SPRING_DATASOURCE_URL 环境变量（host/库名不变，仅收窄连接账号权限）。
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Redis 生产加密码（Phase 41.3）：与 prod compose redis --requirepass 配套，env 注入。
  data:
    redis:
      password: ${REDIS_PASSWORD}
  # Flyway 生产安全：禁用 clean、允许在已有非空库上 baseline，避免首次部署硬失败
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    encoding: UTF-8

logging:
  level:
    cn.edu.gpnu.platform: info
